<!DOCTYPE html>
<!-- «Файловый менеджер» / FilesManager - проводник одной страницей, без сети.
     Где файлы: в браузере - настоящая папка через File System Access API (Chrome, Edge) или
     демо-диск в IndexedDB (там, где API нет, например Firefox); в программе на Electron -
     настоящий диск через preload (window.fmNative, папка electron/ рядом).
     Что умеет: дерево папок, плитки/список/таблица, сортировка, поиск по имени и маске,
     вкладки, две панели, адресная строка с хлебными крошками, история, избранное,
     копировать/вырезать/вставить, переименование, свойства (размер папки), просмотр
     картинок, текста, кода с подсветкой, аудио, видео и PDF, Корзина, горячие клавиши
     Проводника Windows, контекстное меню, пять тем Paint, RU/EN.
     Удаление: в браузере - в Корзину самого приложения (с восстановлением), в программе -
     только в Корзину Windows (shell.trashItem), безвозвратного удаления там нет.
     Законы страницы - tests/web/files-manager.spec.js, проверка законов мутациями -
     tests/web/files-manager-mutate.js. -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="application-name" content="Файловый менеджер">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Файловый менеджер в браузере: дерево папок, вкладки, две панели, поиск, просмотр картинок, текста, кода, аудио, видео и PDF. Работает без интернета.">
<meta name="color-scheme" content="dark light">
<title>Файловый менеджер</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 16a5 5 0 0 1 5-5h14l6 6h22a5 5 0 0 1 5 5v4H6z' fill='%23d9a53a'/%3E%3Crect x='6' y='22' width='52' height='32' rx='5' fill='%23f2c14e'/%3E%3Crect x='14' y='31' width='22' height='4' rx='2' fill='%23fff' opacity='.85'/%3E%3Crect x='14' y='39' width='30' height='4' rx='2' fill='%23fff' opacity='.6'/%3E%3C/svg%3E">
<style>
/* Темы - те же пять, что в Paint Pro, калькуляторах и «Скорости печати» («Стеклянная»,

   Calculators/calcpro-glass/src/themes.css). Смена темы - атрибут data-theme на <html>. */
:root {

  --glass-bg-strong: rgba(255, 255, 255, 0.14);
  --glass-bg-soft: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.18);
  --glass-border-strong: rgba(255, 255, 255, 0.32);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  --blur: blur(28px) saturate(190%);
  --text: #f4f4f8;
  --text-dim: rgba(244, 244, 248, 0.62);
  --accent: #5b8def;
  --accent-2: #9d5bef;
  --accent-grad: linear-gradient(135deg, #5b8def 0%, #9d5bef 100%);
  --danger: #ff5b5b;
  --success: #2dd4a8;
  --app-base: #12101f;
  --app-bg:
    radial-gradient(80% 60% at 12% -10%, rgba(120, 90, 255, 0.55), transparent 60%),
    radial-gradient(65% 50% at 95% 8%, rgba(255, 100, 180, 0.40), transparent 55%),
    radial-gradient(60% 70% at 85% 110%, rgba(60, 200, 255, 0.40), transparent 60%),
    radial-gradient(50% 50% at 5% 105%, rgba(100, 255, 180, 0.30), transparent 60%),
    linear-gradient(135deg, #0e0c1a 0%, #1a1330 50%, #0c1024 100%);
  --ink: 255 255 255;
  --accent-rgb: 91 141 239;
  --on-accent: #ffffff;
  --menu-bg: rgba(30, 26, 52, 0.92);
  --code-kw: #c792ea; --code-str: #c3e88d; --code-num: #f78c6c; --code-com: #7f86a8; --code-fn: #82aaff; --code-tag: #f07178; --code-attr: #ffcb6b;
}
:root[data-theme="formal"] {
  --glass-bg: rgba(255, 255, 255, 0.055);
  --glass-bg-strong: rgba(255, 255, 255, 0.10);
  --glass-bg-soft: rgba(255, 255, 255, 0.035);
  --glass-border: rgba(255, 255, 255, 0.11);
  --glass-border-strong: rgba(255, 255, 255, 0.20);
  --glass-shadow: 0 6px 20px rgba(0, 0, 0, 0.32);
  --blur: blur(20px) saturate(120%);
  --text: #e6e8ec;
  --text-dim: rgba(230, 232, 236, 0.55);
  --accent: #4a7ab8;
  --accent-2: #5c7fa6;
  --accent-grad: linear-gradient(135deg, #4a7ab8 0%, #5c7fa6 100%);
  --app-base: #1f242e;
  --app-bg: linear-gradient(160deg, #1b1f27 0%, #232833 55%, #191d25 100%);
  --ink: 255 255 255;

}

  --glass-bg: rgba(22, 26, 38, 0.045);
  --glass-bg-strong: rgba(22, 26, 38, 0.10);

  --glass-border-strong: rgba(22, 26, 38, 0.26);
  --glass-shadow: 0 6px 20px rgba(30, 40, 70, 0.14);
  --blur: blur(18px) saturate(130%);
  --text: #1b2030;
  --text-dim: rgba(27, 32, 48, 0.62);
  --accent: #3a6fd8;
  --accent-2: #7a52d0;
  --accent-grad: linear-gradient(135deg, #3a6fd8 0%, #7a52d0 100%);
  --danger: #d93636;
  --success: #138a6c;
  --app-base: #e8ecf3;

  --menu-bg: rgba(248, 249, 252, 0.97);
  --code-kw: #7a3fc0; --code-str: #2f7d32; --code-num: #b5541c; --code-com: #7a8296; --code-fn: #1f5fbf; --code-tag: #b0263a; --code-attr: #8a5a00;
}
:root[data-theme="night"] {
  --glass-bg: rgba(255, 255, 255, 0.045);
  --glass-bg-strong: rgba(255, 255, 255, 0.085);
  --glass-bg-soft: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.09);
  --glass-border-strong: rgba(255, 255, 255, 0.17);
  --glass-shadow: 0 6px 22px rgba(0, 0, 0, 0.55);
  --blur: blur(18px) saturate(110%);
  --text: #dcdde3;
  --text-dim: rgba(220, 221, 227, 0.52);
  --accent: #4668a8;
  --accent-2: #6a5aa0;
  --accent-grad: linear-gradient(135deg, #4668a8 0%, #6a5aa0 100%);
  --app-base: #08090e;
  --app-bg: linear-gradient(160deg, #06070b 0%, #0b0d13 55%, #05060a 100%);
  --ink: 255 255 255;

}
:root[data-theme="warm"] {
  --glass-bg: rgba(255, 236, 210, 0.07);
  --glass-bg-strong: rgba(255, 236, 210, 0.13);
  --glass-bg-soft: rgba(255, 236, 210, 0.045);
  --glass-border: rgba(255, 226, 190, 0.16);
  --glass-border-strong: rgba(255, 226, 190, 0.28);
  --glass-shadow: 0 8px 26px rgba(30, 16, 6, 0.45);
  --blur: blur(22px) saturate(150%);
  --text: #f5ead9;
  --text-dim: rgba(245, 234, 217, 0.60);
  --accent: #d08a3c;
  --accent-2: #b4562f;
  --accent-grad: linear-gradient(135deg, #d08a3c 0%, #b4562f 100%);
  --app-base: #1d1610;
  --app-bg:
    radial-gradient(65% 55% at 10% -8%, rgba(190, 110, 40, 0.35), transparent 60%),

* { box-sizing: border-box; }
html { background: var(--app-base); height: 100%; }
body {
  margin: 0; height: 100%; overflow: hidden; color: var(--text); background: transparent;
  font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", sans-serif;
}
body::before { content: ''; position: fixed; inset: 0; background: var(--app-bg); z-index: -1; pointer-events: none; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.no-anim * { transition: none !important; animation: none !important; }

#app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

/* --- верхняя панель команд --- */
#toolbar {
  display: flex; align-items: center; gap: 2px; padding: 6px 8px; min-width: 0;
  background: var(--glass-bg-soft); border-bottom: 1px solid var(--glass-border);
  overflow-x: auto; scrollbar-width: none;
}
#toolbar::-webkit-scrollbar { display: none; }
.tb {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 9px; flex: none;
  border: 1px solid transparent; border-radius: 8px; background: transparent; cursor: pointer; white-space: nowrap;
}
.tb:hover:not(:disabled) { background: var(--glass-bg-strong); }
.tb:active:not(:disabled) { transform: translateY(1px); }
.tb:disabled { opacity: 0.38; cursor: default; }
.tb.on { background: rgb(var(--accent-rgb) / 0.22); border-color: rgb(var(--accent-rgb) / 0.5); }
.tb .lbl { font-size: 12.5px; }
.tb-sep { width: 1px; height: 22px; background: var(--glass-border); margin: 0 4px; flex: none; }
.tb-grow { flex: 1; min-width: 4px; }
.brand { display: inline-flex; align-items: center; gap: 7px; padding: 0 8px 0 2px; font-weight: 600; flex: none; }
.brand svg { width: 22px; height: 22px; }
.tb.primary { background: var(--accent-grad); color: var(--on-accent); }

/* --- основная часть: боковая панель, панели, просмотр --- */
#main { display: grid; grid-template-columns: var(--side-w, 236px) minmax(0, 1fr) auto; min-height: 0; gap: 6px; padding: 6px; }
#sidebar {
  min-height: 0; overflow: auto; padding: 6px 4px; border-radius: 12px;
  background: var(--glass-bg-soft); border: 1px solid var(--glass-border);
}
.side-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); padding: 10px 10px 4px; display: flex; align-items: center; }
.side-h:first-child { padding-top: 4px; }
.sn {
  display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 calc(6px + var(--d, 0) * 14px);
  border-radius: 7px; cursor: pointer; white-space: nowrap; overflow: hidden; position: relative;
}
.sn:hover { background: var(--glass-bg); }
.sn.here { background: rgb(var(--accent-rgb) / 0.22); }
.sn.drop { outline: 2px solid var(--accent); outline-offset: -2px; }
.sn .tw { width: 16px; height: 16px; display: inline-grid; place-items: center; flex: none; border-radius: 4px; color: var(--text-dim); }
.sn .tw:hover { background: var(--glass-bg-strong); }
.sn .tw svg { width: 12px; height: 12px; transition: transform .12s; }
.sn.open > .tw svg { transform: rotate(90deg); }
.sn .tw.leaf { visibility: hidden; }
.sn .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.sn .ico { width: 18px; height: 18px; }
.sn .x { opacity: 0; border: 0; background: none; padding: 2px; border-radius: 5px; cursor: pointer; color: var(--text-dim); }
.sn:hover .x { opacity: 1; }
.sn .badge { font-size: 11px; color: var(--text-dim); }
.side-note { font-size: 12px; color: var(--text-dim); padding: 6px 10px; }

#panels { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; min-height: 0; }
#panels.dual { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.panel {
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-width: 0; min-height: 0;
  border-radius: 12px; background: var(--glass-bg-soft); border: 1px solid var(--glass-border); overflow: hidden;
}
#panels.dual .panel.active { border-color: rgb(var(--accent-rgb) / 0.75); box-shadow: 0 0 0 1px rgb(var(--accent-rgb) / 0.35); }

/* вкладки */
.tabs { display: flex; align-items: flex-end; gap: 2px; padding: 5px 6px 0; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
.tab {
  display: flex; align-items: center; gap: 6px; height: 30px; min-width: 60px; max-width: 200px; padding: 0 6px 0 10px; flex: 0 1 auto;
  border-radius: 8px 8px 0 0; background: var(--glass-bg-soft); border: 1px solid transparent; border-bottom: 0; cursor: pointer;
}
.tab .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.tab.cur { background: var(--glass-bg-strong); border-color: var(--glass-border); }
.tab .x { border: 0; background: none; border-radius: 5px; padding: 2px; cursor: pointer; display: grid; place-items: center; color: var(--text-dim); }
.tab .x:hover { background: var(--glass-bg-strong); color: var(--text); }
.tab .x svg { width: 12px; height: 12px; }
.tab .ico { width: 16px; height: 16px; }
.tab.drop { outline: 2px solid var(--accent); }
.tab-add { border: 0; background: none; border-radius: 7px; height: 28px; width: 28px; display: grid; place-items: center; cursor: pointer; flex: none; margin-bottom: 1px; }
.tab-add:hover { background: var(--glass-bg); }

/* строка навигации: кнопки, адрес, поиск */
.nav { display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--glass-bg-strong); border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border); min-width: 0; }
.nb { width: 30px; height: 30px; border: 0; background: none; border-radius: 7px; display: grid; place-items: center; cursor: pointer; flex: none; }
.nb:hover:not(:disabled) { background: var(--glass-bg-strong); }
.nb:disabled { opacity: .35; cursor: default; }
.addr {
  flex: 1 1 auto; min-width: 80px; height: 30px; display: flex; align-items: center; border-radius: 8px;
  background: var(--glass-bg); border: 1px solid var(--glass-border); overflow: hidden; position: relative;
}
.crumbs { display: flex; align-items: center; min-width: 0; height: 100%; overflow: hidden; flex: 1; cursor: text; padding-left: 4px; }
.crumb { border: 0; background: none; padding: 0 6px; height: 24px; border-radius: 6px; cursor: pointer; white-space: nowrap; flex: none; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.crumb:hover, .crumb-sep:hover { background: var(--glass-bg-strong); }
.crumb.drop { outline: 2px solid var(--accent); }
.crumb-sep { border: 0; background: none; height: 24px; width: 18px; padding: 0; border-radius: 5px; cursor: pointer; display: grid; place-items: center; color: var(--text-dim); flex: none; }
.crumb-sep svg { width: 11px; height: 11px; }
.crumbs .more { color: var(--text-dim); padding: 0 4px; flex: none; }
.addr-input { flex: 1; height: 100%; border: 0; outline: 0; background: transparent; padding: 0 10px; min-width: 0; }
.search { flex: 0 1 220px; min-width: 110px; height: 30px; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 8px; border-radius: 8px; background: var(--glass-bg); border: 1px solid var(--glass-border); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; }
.search:focus-within, .addr:focus-within { border-color: rgb(var(--accent-rgb) / 0.7); }
.search .sx { border: 0; background: none; border-radius: 5px; padding: 2px; cursor: pointer; display: grid; place-items: center; }
.search .sx svg { width: 12px; height: 12px; }

/* список файлов (виртуальный: в DOM только видимые строки) */
.view { position: relative; overflow: auto; outline: none; min-height: 0; user-select: none; }
.view:focus-visible { box-shadow: inset 0 0 0 1px rgb(var(--accent-rgb) / 0.4); }
.view.drop { box-shadow: inset 0 0 0 2px var(--accent); }
.thead {
  position: sticky; top: 0; z-index: 2; display: grid; height: 30px; align-items: center;
  background: var(--app-base); border-bottom: 1px solid var(--glass-border); font-size: 12px; color: var(--text-dim);
}
.thead > button { border: 0; background: none; height: 100%; text-align: left; padding: 0 10px; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
.thead > button:hover { background: var(--glass-bg); color: var(--text); }
.thead > button.sorted { color: var(--text); }
.thead > button svg { width: 11px; height: 11px; }
.thead > button.r { justify-content: flex-end; }
.canvas { position: relative; }
.it { position: absolute; border-radius: 7px; border: 1px solid transparent; cursor: default; }
.it:hover { background: var(--glass-bg); }
.it.sel { background: rgb(var(--accent-rgb) / 0.26); border-color: rgb(var(--accent-rgb) / 0.45); }
.it.cur { border-color: rgb(var(--accent-rgb) / 0.9); }
.it.cut { opacity: .45; }
.it.hid .nm { opacity: .65; }
.it.drop { outline: 2px solid var(--accent); background: rgb(var(--accent-rgb) / 0.2); }
.it .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { display: grid; align-items: center; height: 28px; }
.row > span { padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .c-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .c-size { text-align: right; }
.row .dim, .row .c-date, .row .c-type, .row .c-size, .row .c-where { color: var(--text-dim); }
.row .ico { width: 18px; height: 18px; flex: none; }
.cell { display: flex; align-items: center; gap: 8px; padding: 0 8px; height: 30px; }
.cell .ico { width: 20px; height: 20px; flex: none; }
.tile { display: flex; flex-direction: column; align-items: center; padding: 8px 6px 4px; text-align: center; }
.tile .th { width: 72px; height: 64px; display: grid; place-items: center; flex: none; }
.tile .th .ico { width: 60px; height: 60px; }
.tile .th img { max-width: 72px; max-height: 64px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.35); object-fit: contain; background: rgba(255,255,255,.04); }
.tile .nm { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; line-height: 1.3; margin-top: 4px; max-width: 100%; }
.tile .sub { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.drive-bar { width: 80px; height: 5px; border-radius: 3px; background: var(--glass-bg-strong); overflow: hidden; margin-top: 3px; }
.drive-bar > i { display: block; height: 100%; background: var(--accent); }
.empty-msg { position: absolute; left: 0; right: 0; top: 64px; text-align: center; color: var(--text-dim); padding: 0 16px; pointer-events: none; }
.empty-msg.err { color: var(--danger); }
.band { position: absolute; border: 1px solid var(--accent); background: rgb(var(--accent-rgb) / 0.15); pointer-events: none; z-index: 3; }
.rename {
  position: absolute; z-index: 4; height: 24px; padding: 0 6px; border-radius: 5px; outline: 0;
  border: 1px solid var(--accent); background: var(--app-base); color: var(--text); min-width: 60px;
}
.rename.bad { border-color: var(--danger); }
.status { display: flex; align-items: center; gap: 12px; height: 26px; padding: 0 10px; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--glass-border); white-space: nowrap; overflow: hidden; }
.status .grow { flex: 1; }
.status .stop { border: 0; background: var(--glass-bg-strong); border-radius: 5px; padding: 1px 8px; cursor: pointer; }

/* значки типов файлов (цвета постоянные, как в Проводнике) */
.ico { flex: none; }
.k-folder { color: #f2c14e; } .k-image { color: #4fb47a; } .k-audio { color: #e0679f; } .k-video { color: #9b6bf2; }
.k-pdf { color: #e5534b; } .k-code { color: #4aa3df; } .k-text { color: #9aa4b2; } .k-archive { color: #c98d4b; }
.k-exe { color: #5b8def; } .k-doc { color: #3d7fd6; } .k-file { color: #9aa4b2; } .k-drive { color: #8fa3bf; } .k-place { color: var(--accent); }
.k-trash { color: #8fa3bf; } .k-star { color: #f2c14e; } .k-demo { color: #2dd4a8; } .k-pc { color: #8fa3bf; }

/* панель просмотра справа */
#preview {
  width: var(--prev-w, 320px); min-width: 0; min-height: 0; overflow: auto; border-radius: 12px; padding: 12px;
  background: var(--glass-bg-soft); border: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 10px;
}
.pv-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pv-head .ico { width: 40px; height: 40px; }
.pv-name { font-weight: 600; word-break: break-word; }
.pv-sub { color: var(--text-dim); font-size: 12px; }
.pv-body { min-height: 0; }
.pv-body img { max-width: 100%; border-radius: 6px; display: block; margin: 0 auto; background: repeating-conic-gradient(rgba(128,128,128,.18) 0 25%, transparent 0 50%) 0 0/16px 16px; }
.pv-body video, .pv-body audio { width: 100%; }
.pv-body iframe { width: 100%; height: 420px; border: 0; border-radius: 6px; background: #fff; }
.pv-props { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
.pv-props dt { color: var(--text-dim); }
.pv-props dd { margin: 0; word-break: break-word; }
.pv-note { font-size: 12px; color: var(--text-dim); }
.code { display: flex; font: 12px/1.5 "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; border-radius: 8px; background: rgba(0,0,0,.22); overflow: auto; max-height: 100%; }
:root[data-theme="light"] .code { background: rgba(22, 26, 38, .05); }
.code pre { margin: 0; padding: 8px 10px; white-space: pre; tab-size: 4; }
.code .gut { color: var(--text-dim); text-align: right; user-select: none; border-right: 1px solid var(--glass-border); position: sticky; left: 0; background: inherit; }
.code .src { flex: 1; }
.code.wrap .src { white-space: pre-wrap; word-break: break-word; }
.tk-k { color: var(--code-kw); } .tk-s { color: var(--code-str); } .tk-n { color: var(--code-num); } .tk-c { color: var(--code-com); font-style: italic; }
.tk-f { color: var(--code-fn); } .tk-t { color: var(--code-tag); } .tk-a { color: var(--code-attr); }
.hex { font: 12px/1.5 "Cascadia Mono", Consolas, monospace; white-space: pre; overflow: auto; color: var(--text-dim); margin: 0; }

/* окно просмотра на весь экран */
#viewer { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: auto minmax(0, 1fr); background: rgba(6, 6, 12, 0.88); backdrop-filter: blur(6px); }
:root[data-theme="light"] #viewer { background: rgba(232, 236, 243, 0.94); }
.vw-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--glass-border); min-width: 0; }
.vw-head .pv-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vw-body { min-height: 0; overflow: auto; display: grid; place-items: center; padding: 12px; }
.vw-body > * { max-width: 100%; }
.vw-body img { max-width: 100%; max-height: calc(100vh - 90px); object-fit: contain; }
.vw-body video { max-width: 100%; max-height: calc(100vh - 90px); }
.vw-body audio { width: min(560px, 100%); }
.vw-body iframe { width: min(1100px, 100%); height: calc(100vh - 90px); border: 0; background: #fff; border-radius: 6px; }
.vw-body .code { width: min(1100px, 100%); max-height: calc(100vh - 90px); align-self: start; }

/* меню, диалоги, уведомления */
#menu {
  position: fixed; z-index: 60; min-width: 220px; max-width: min(340px, calc(100vw - 16px)); padding: 5px; border-radius: 10px;
  background: var(--menu-bg); border: 1px solid var(--glass-border-strong); box-shadow: var(--glass-shadow); backdrop-filter: var(--blur);
  max-height: calc(100vh - 16px); overflow-y: auto;
}
.mi { display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; padding: 0 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; text-align: left; white-space: nowrap; }
.mi:hover:not(:disabled), .mi.hot { background: rgb(var(--accent-rgb) / 0.25); }
.mi:disabled { opacity: .4; cursor: default; }
.mi .k { margin-left: auto; padding-left: 16px; color: var(--text-dim); font-size: 11.5px; }
.mi .chk { width: 18px; text-align: center; }
.mi .nm { overflow: hidden; text-overflow: ellipsis; }
.ms { height: 1px; background: var(--glass-border); margin: 4px 6px; }
#modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0, 0, 0, 0.38); padding: 12px; }
.dlg {
  width: min(460px, 100%); max-height: calc(100vh - 24px); overflow: auto; border-radius: 14px; padding: 18px;
  background: var(--menu-bg); border: 1px solid var(--glass-border-strong); box-shadow: var(--glass-shadow); backdrop-filter: var(--blur);
}
.dlg.wide { width: min(640px, 100%); }
.dlg h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.dlg h2 .ico { width: 32px; height: 32px; }
.dlg p { margin: 6px 0; color: var(--text-dim); word-break: break-word; }
.dlg ul.names { margin: 6px 0; padding-left: 18px; max-height: 140px; overflow: auto; word-break: break-all; }
.dlg input[type=text] { width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--glass-border-strong); background: var(--glass-bg); outline: 0; }
.dlg input[type=text]:focus { border-color: var(--accent); }
.dlg .err { color: var(--danger); min-height: 18px; font-size: 12px; margin-top: 4px; }
.dlg .btns { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--glass-border-strong); background: var(--glass-bg-strong); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent-grad); color: var(--on-accent); border-color: transparent; }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.dlg label.chk { display: flex; align-items: center; gap: 8px; margin: 8px 0; cursor: pointer; }
.props { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 8px 0; }
.props dt { color: var(--text-dim); }
.props dd { margin: 0; word-break: break-word; }
.props hr { grid-column: 1 / -1; border: 0; border-top: 1px solid var(--glass-border); margin: 4px 0; width: 100%; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
.swatch { height: 34px; padding: 0 12px; border-radius: 9px; border: 2px solid transparent; color: #fff; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px rgb(var(--accent-rgb) / .35); }
.seg { display: inline-flex; border: 1px solid var(--glass-border-strong); border-radius: 8px; overflow: hidden; margin: 4px 0 10px; }
.seg button { border: 0; background: none; padding: 6px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: rgb(var(--accent-rgb) / 0.3); }
.keys { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.keys td { padding: 4px 6px; border-bottom: 1px solid var(--glass-border); vertical-align: top; }
.keys td:first-child { white-space: nowrap; color: var(--text-dim); font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; }
.keys h3 { font-size: 13px; margin: 12px 0 4px; }
#toast {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 70; max-width: min(560px, calc(100vw - 24px));
  padding: 10px 16px; border-radius: 10px; background: var(--menu-bg); border: 1px solid var(--glass-border-strong); box-shadow: var(--glass-shadow);
}
#toast.err { border-color: var(--danger); }
#busy { position: fixed; right: 14px; bottom: 14px; z-index: 65; padding: 10px 14px; border-radius: 10px; background: var(--menu-bg); border: 1px solid var(--glass-border-strong); display: flex; gap: 10px; align-items: center; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--glass-border-strong); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#drop-hint { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; pointer-events: none; background: rgb(var(--accent-rgb) / 0.12); border: 3px dashed var(--accent); font-size: 18px; }
.foot-ver { font-size: 11px; color: var(--text-dim); padding: 10px; }

/* узкое окно и телефон */
.side-toggle { display: none; }
@media (max-width: 900px) {
  #preview { position: fixed; right: 8px; top: 56px; bottom: 8px; width: min(340px, calc(100vw - 16px)); z-index: 30; background: var(--menu-bg); }
  .tb .lbl { display: none; }
}
@media (max-width: 720px) {
  #main { grid-template-columns: minmax(0, 1fr); padding: 4px; }
  #sidebar { position: fixed; left: 4px; top: 50px; bottom: 4px; width: min(280px, calc(100vw - 40px)); z-index: 30; background: var(--menu-bg); display: none; }
  body.side-open #sidebar { display: block; }
  .side-toggle { display: inline-flex; }
  #panels.dual { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .search { flex-basis: 120px; min-width: 70px; }
  .nav .nb.hide-narrow { display: none; }
  .brand .lbl { display: none; }
}
</style>

    try { const v = localStorage.getItem(STORE + key); return v == null ? def : JSON.parse(v); } catch (e) { this.ok = false; return def; }

    try { localStorage.setItem(STORE + key, JSON.stringify(value)); return true; } catch (e) { this.ok = false; return false; }
  },

const DEFAULTS = { theme: 'glass', ui: 'ru', view: 'table', sort: 'name', desc: false, hidden: false, ext: true, dual: false, preview: false, wrap: false };

  const f = (I18N[settings.ui] || I18N.ru).plural[key];
  if (settings.ui === 'en') return `${n.toLocaleString('en')} ${n === 1 ? f[0] : f[1]}`;
  const a = Math.abs(n) % 100, b = a % 10;

function makeWav(freq = 440, secs = 1, rate = 8000) {

}
function makePdf(lines) {

    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 420 300] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>',
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
  ];

  const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const x = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF\n`;

class DropVolume {
  constructor(roots) { this.id = 'drop:' + uid(); this.kind = 'drop'; this.sep = '/'; this.rootPath = '/'; this.root = { name: '', dir: true, kids: roots }; }
  get label() { return ''; }
  join(d, n) { return Core.vjoin(d, n); }
  parent(p) { return Core.vparent(p); }
  base(p) { return Core.vbase(p); }
  node(p) {
    let n = this.root;
    for (const part of p.split('/').filter(Boolean)) { n = (n.kids || []).find((k) => k.name === part); if (!n) throw fail('ENOENT'); }
    return n;
  }

  async stat(p) { return this.entry(this.node(p), p); }

}
// FileSystemEntry (перетаскивание папки в браузере) -> узел { name, dir, file | kids }
async function readDropEntry(entry) {
  if (entry.isFile) return { name: entry.name, dir: false, file: await new Promise((res, rej) => entry.file(res, rej)) };
  const reader = entry.createReader();
  const kids = [];
  for (;;) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) break;
    for (const e of batch) kids.push(await readDropEntry(e));

  return { name: entry.name, dir: true, kids };
}

  const dlg = document.createElement('div');
  dlg.className = 'dlg' + (wide ? ' wide' : '');
  dlg.setAttribute('role', 'dialog');
  dlg.innerHTML = html;
  host.replaceChildren(dlg);
  host.hidden = false;
  const prevFocus = document.activeElement;
  const m = {
    el: dlg,
    close() {
      if (m.closed) return;
      m.closed = true;
      Modal.stack = Modal.stack.filter((x) => x !== m);
      host.hidden = true; host.replaceChildren();
      if (onClose) onClose();
      if (prevFocus && prevFocus.isConnected) prevFocus.focus(); else focusView();
    },
    onKey,
  };
  Modal.stack.push(m);
  setTimeout(() => { const f = dlg.querySelector('[autofocus], input, .btn.primary, .btn'); if (f) f.focus(); }, 0);
  return m;
}
function namesList(names) {

}
// Вопрос «да/нет»: Enter - да, Esc - нет
function ask({ title, text, note = '', names = null, ok = t('d.ok'), danger = false, icon = '' }) {
  return new Promise((res) => {
    const m = openModal(`<h2>${icon}${esc(title)}</h2><p class="q">${esc(text)}</p>${names ? namesList(names) : ''}${note ? `<p class="note">${esc(note)}</p>` : ''}<div class="btns"><button class="btn" data-act="cancel">${esc(t('d.cancel'))}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="ok" autofocus>${esc(ok)}</button></div>`, {
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') { e.preventDefault(); finish(false); } },
      onClose: () => res(false),
    });
    const finish = (v) => { res(v); m.close(); };
    m.el.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b) finish(b.dataset.act === 'ok'); });
  });
}
// Имя занято: заменить (старое - в Корзину), оставить оба, пропустить; «так же для остальных»
function conflictDialog(dirLabel, name, rest) {
  return new Promise((res) => {
    const m = openModal(`<h2>${esc(t('c.title'))}</h2><p>${esc(t('c.text', dirLabel, name))}</p>${rest > 0 ? `<label class="chk"><input type="checkbox" class="all"> ${esc(t('c.all', rest))}</label>` : ''}<div class="btns"><button class="btn" data-act="cancel">${esc(t('d.cancel'))}</button><button class="btn" data-act="skip">${esc(t('c.skip'))}</button><button class="btn" data-act="replace">${esc(t('c.replace'))}</button><button class="btn primary" data-act="keep" autofocus>${esc(t('c.keep'))}</button></div>`, {
      onKey: (e) => { if (e.key === 'Escape') { e.preventDefault(); finish('cancel'); } },
      onClose: () => res({ choice: 'cancel', all: false }),
    });
    const finish = (choice) => { const all = !!(m.el.querySelector('.all') || {}).checked; res({ choice, all }); m.close(); };
    m.el.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b) finish(b.dataset.act); });

// Операции с файлами
function itemsOf(tab, entries) {
  return entries.filter((e) => !isPseudo(e)).map((e) => ({ vol: tab.loc.vol, path: e.path, name: e.name, dir: !!e.dir }));
}
async function crossCopy(sv, spath, dv, ddir, name) {
  const st = await sv.stat(spath);
  if (st.dir) {
    const p = await dv.mkdir(ddir, name);
    for (const c of await sv.list(spath)) await crossCopy(sv, c.path, dv, p, c.name);
    return p;
  }
  return dv.writeFile(ddir, name, await sv.readBlob(spath));
}
// Копирование и перенос: в ту же папку - «имя - копия», занятое имя в другой папке -
// вопрос (заменить: старое в Корзину, а не затирается; оставить оба; пропустить).
// Два объекта и больше - сначала вопрос «копировать N в ...?».
async function transfer(items, dest, mode, { confirm = true, title = null, askText = null } = {}) {
  items = items.filter(Boolean);
  if (!items.length) return [];
  const dv = vol(dest.vol);
  if (!dv || dest.path === TRASH || (dv.kind === 'native' && dest.path === '')) { toast(errText(fail('EACCES')), true); return []; }
  if (confirm && items.length >= 2) {
    const ok = await ask({
      title: title || t(mode === 'copy' ? 'd.copyTitle' : 'd.moveTitle'),
      text: askText || t(mode === 'copy' ? 'd.copyMany' : 'd.moveMany', plural(items.length, 'items'), dv.base(dest.path)),
      names: items.map((i) => i.name), ok: title ? t('d.ok') : t(mode === 'copy' ? 'm.copy' : 'd.moveTitle'),
    });
    if (!ok) return [];
  }
  const done = busy(t(mode === 'copy' ? 'busy.copy' : 'busy.move'));
  const results = [], errors = [];
  const touched = new Set([dest.vol]);
  try {
    let taken;
    try { taken = new Set((await dv.list(dest.path)).map((e) => Core.key(e.name))); } catch (e) { toast(errText(e), true); return []; }
    let rule = null;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const sv = vol(it.vol);
      if (!sv) continue;
      touched.add(it.vol);
      const same = sv === dv;
      const sParent = sv.parent(it.path);
      const sameDir = same && sParent !== null && sameLoc({ vol: dv.id, path: sParent }, dest);
      if (mode === 'move' && sameDir) continue;
      if (same && it.dir && dv.inside(it.path, dest.path)) { errors.push(fail('EINSIDE')); continue; }
      let name = it.name;
      if (taken.has(Core.key(name))) {
        if (sameDir && mode === 'copy') name = Core.freeName(name, taken, { dir: it.dir, style: 'copy', copyWord: t('copyWord') });
        else {
          let choice = rule;
          if (!choice) {
            const r = await conflictDialog(dv.base(dest.path), name, items.length - i - 1);
            if (r.choice === 'cancel') break;
            choice = r.choice;
            if (r.all) rule = choice;
          }
          if (choice === 'skip') continue;
          if (choice === 'keep') name = Core.freeName(name, taken, { dir: it.dir });
          if (choice === 'replace') {
            const old = (await dv.list(dest.path)).find((e) => Core.key(e.name) === Core.key(name));
            if (old) {
              if (same && (old.path === it.path || dv.inside(old.path, it.path))) continue; // заменить самим собой - нечего делать
              try { await dv.trash([old.path]); } catch (e) { errors.push(e); continue; }
              taken.delete(Core.key(old.name));
            }
          }
        }
      }
      try {
        let p;
        if (same) p = mode === 'copy' ? await dv.copy(it.path, dest.path, name) : await dv.move(it.path, dest.path, name);
        else { p = await crossCopy(sv, it.path, dv, dest.path, name); if (mode === 'move') await sv.trash([it.path]); }
        taken.add(Core.key(name));
        results.push(p);
      } catch (e) { errors.push(e); }
    }
  } finally { done(); }
  if (mode === 'move' && App.clip && App.clip.mode === 'cut') App.clip = null;
  for (const id of touched) if (App.vols.has(id) && !id.startsWith('drop:')) refreshVol(id);
  // выделить вставленное во вкладке назначения
  for (const p of App.panels) if (isVisibleTab(p.tab) && sameLoc(p.tab.loc, dest)) { const tab = p.tab; await waitLoad(tab); selectPaths(tab, results, true); }
  report(results.length, results.length + errors.length, errors, mode === 'copy' ? 'ok.copied' : 'ok.moved');
  return results;
}
function report(ok, total, errors, okKey) {
  if (errors.length && ok) toast(t('ok.partial', ok, total, errText(errors[0])), true);
  else if (errors.length) toast(errText(errors[0]), true);

}
function waitLoad(tab) {

}

// Переименование на месте: имя без расширения выделено, Enter - сохранить, Esc - отмена
let renaming = null;
function startRename(tab, e) {
  if (!e || isPseudo(e) || tab.loc.path === TRASH) return;
  const p = panelOfTab(tab);
  finishRename(false);
  scrollToPath(tab, e.path);
  const item = p.items.querySelector(`.it[data-path="${CSS.escape(e.path)}"]`);
  if (!item) return;
  const nm = item.querySelector('.nm');
  const box = p.canvas.getBoundingClientRect(), r = nm.getBoundingClientRect(), ir = item.getBoundingClientRect();
  const input = document.createElement('input');
  input.className = 'rename';

  input.value = e.name;
  const left = (p.layout.mode === 'tile' ? ir.left + 2 : r.left - 4) - box.left;
  const width = p.layout.mode === 'tile' ? ir.width - 4 : Math.max(160, Math.min(ir.right - r.left, 420));
  input.style.left = left + 'px';
  input.style.top = (r.top - box.top + (r.height - 24) / 2) + 'px';
  input.style.width = width + 'px';
  p.canvas.appendChild(input);
  renaming = { tab, entry: e, input, p };
  input.focus();

    if (ev.key === 'Enter') { ev.preventDefault(); finishRename(true); }

async function finishRename(commit) {
  const r = renaming;
  if (!r) return;
  renaming = null;
  const name = r.input.value;
  r.input.remove();
  focusView(r.p);
  if (!commit || name === r.entry.name) return;
  const err = Core.nameError(name);
  if (err) { toast(t('n.' + err), true); return; }
  const v = vol(r.tab.loc.vol);
  await pend(async () => {
    try {
      const np = await v.rename(r.entry.path, name);
      if (App.clip) for (const it of App.clip.items) if (it.vol === v.id && it.path === r.entry.path) { it.path = np; it.name = name; }
      const fav = App.favorites.find((f) => f.vol === v.id && f.path === r.entry.path);
      if (fav) { fav.path = np; saveFavs(); }
      await load(r.tab);
      refreshVol(v.id);
      await waitLoad(r.tab);
      selectPaths(r.tab, [np], true);
    } catch (e) { toast(errText(e), true); }
  });
}
// Свойства: размер папки считается с ходом и прерывается закрытием окна
async function showProperties() {

  let self = false;
  if (!entries.length) {
    if (tab.loc.path === TRASH) entries = [];
    else { try { entries = [await v.stat(tab.loc.path)]; self = true; } catch (e) { entries = []; } }
    if (!entries.length) return;
  }
  const ctrl = new AbortController();
  const one = entries.length === 1 ? entries[0] : null;
  const title = one ? t('pr.title', one.name) : t('pr.title', plural(entries.length, 'items'));
  const rows = [];
  if (one) {
    rows.push([t('pr.type'), typeLabel(one)]);
    if (!self && tab.loc.path !== TRASH) rows.push([t('pr.location'), displayPath(v, v.parent(one.path))]);
    if (one.from) rows.push([t('pr.from'), one.from]);

    if (one.dir && !one.drive) rows.push([t('pr.contains'), `<span class="p-count">${esc(t('pr.counting'))}</span>`, true]);
    if (one.drive && one.total) rows.push([t('pr.total'), fmtSize(one.total)], [t('pr.free'), fmtSize(one.free)]);
    rows.push(['hr']);
    if (one.ctime) rows.push([t('pr.created'), fmtDate(one.ctime)]);
    if (one.mtime) rows.push([t('pr.modified'), fmtDate(one.mtime)]);
    if (one.atime && !one.dir) rows.push([t('pr.accessed'), fmtDate(one.atime)]);

    const files = entries.filter((e) => !e.dir).length;
    rows.push([t('pr.items'), `${plural(files, 'files')}, ${plural(entries.length - files, 'folders')}`]);
    rows.push([t('pr.size'), `<span class="p-size">${esc(t('pr.counting'))}</span>`, true]);
    rows.push([t('pr.contains'), `<span class="p-count">${esc(t('pr.counting'))}</span>`, true]);
  }
  const m = openModal(`<h2>${iconHtml(one ? kindOfEntry(one) : 'file')}<span style="min-width:0;word-break:break-word">${esc(title)}</span></h2><dl class="props">${rows.map((r) => (r[0] === 'hr' ? '<hr>' : `<dt>${esc(r[0])}</dt><dd>${r[2] ? r[1] : esc(r[1])}</dd>`)).join('')}</dl><div class="btns"><button class="btn primary" data-act="ok">${esc(t('d.close'))}</button></div>`, {
    onKey: (e) => { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); m.close(); } },

  const dirs = entries.filter((e) => e.dir && !e.drive);
  if (!dirs.length && one) return;
  const total = { bytes: 0, files: 0, dirs: 0 };
  for (const e of entries) if (!e.dir) { total.bytes += e.size || 0; total.files++; }
  const show = (st) => {
    const s = m.el.querySelector('.p-size'), c = m.el.querySelector('.p-count');
    if (s) s.textContent = bytesExact(st.bytes);
    if (c) c.textContent = `${plural(st.files, 'files')}, ${plural(st.dirs, 'folders')}`;
  };
  await pend(async () => {
    try {
      for (const d of dirs) {
        const base = { ...total };
        const st = await v.size(d.path, { signal: ctrl.signal, onProgress: (x) => show({ bytes: base.bytes + x.bytes, files: base.files + x.files, dirs: base.dirs + x.dirs + (one ? 0 : 1) }) });

  });
}
function displayPath(v, p) {
  if (p === null || p === undefined) return '';
  if (v.kind === 'native') return p === '' ? v.label : p;
  if (p === TRASH) return v.label + ': ' + t('side.trash');

}

  tab.sel.clear(); tab.focus = null;
  let rt = 0;
  const flush = () => { rt = 0; if (tab.search === s) { refilter(tab); if (isVisibleTab(tab)) renderTab(tab); } };
  const onBatch = (items) => { if (tab.search !== s) return; for (const e of items) if (s.results.length < SEARCH_LIMIT) s.results.push(e); if (!rt) rt = setTimeout(flush, 60); };
  refilter(tab);
  if (isVisibleTab(tab)) renderTab(tab);
  if (tab === activeTab()) { updateTitle(); renderToolbar(); renderSidebar(); }
  await pend(async () => {
    let r = {};
    try {
      // в «Этом компьютере» ищем по папкам пользователя и дискам по очереди
      if (v.kind === 'native' && tab.loc.path === '') { for (const d of (await v.list('')).filter((x) => x.drive)) { if (ctrl.signal.aborted) break; await v.search(d.path, m, { onBatch, signal: ctrl.signal }); } }
      else r = (await v.search(tab.loc.path, m, { onBatch, signal: ctrl.signal })) || {};
    } catch (e) { if (tab.search === s) toast(errText(e), true); }
    clearTimeout(rt);
    if (tab.search !== s) return;
    s.running = false;
    s.limited = !!r.limited || s.results.length >= SEARCH_LIMIT;
    flush();
  });
}

function addTab(panel, loc, activate = true) {
  const tab = newTab(loc);
  panel.tabs.splice(panel.cur + 1, 0, tab);

  afterNav(panel.tab);

}
function closeTab(panel, tab) {

  stopSearch(tab); unwatchTab(tab);
  panel.tabs.splice(i, 1);
  if (panel.cur >= panel.tabs.length || i < panel.cur) panel.cur = Math.max(0, panel.cur - (i <= panel.cur ? 1 : 0));
  if (panel.cur >= panel.tabs.length) panel.cur = panel.tabs.length - 1;

}

}

    ${text ? `<button class="nb${settings.wrap ? ' on' : ''}" data-vw="wrap" title="${esc(t('pv.wrap'))}"><svg class="i"><use href="#i-wrap"/></svg></button>` : ''}
    ${NATIVE && vol(tab.loc.vol).kind === 'native' ? `<button class="nb" data-vw="system" title="${esc(t('pv.openSys'))}"><svg class="i"><use href="#i-open"/></svg></button>` : ''}
    <button class="nb" data-vw="prev" title="${esc(t('vw.prev'))}" ${i <= 0 ? 'disabled' : ''}><svg class="i"><use href="#i-prev"/></svg></button>
    <button class="nb" data-vw="next" title="${esc(t('vw.next'))}" ${i < 0 || i >= files.length - 1 ? 'disabled' : ''}><svg class="i"><use href="#i-next"/></svg></button>
    <button class="nb" data-vw="close" title="${esc(t('vw.close'))}"><svg class="i"><use href="#i-x"/></svg></button></div><div class="vw-body"></div>`;

async function openFolder() {
  if (!HAS_PICKER) { toast(t('side.noApi')); return; }
  let h;
  try { h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'files-manager' }); } catch (e) {
    if (e && e.name !== 'AbortError') toast(t('e.openFolder', e.message || e), true);
    return;
  }
  for (const v of App.vols.values()) {
    if (v.kind === 'handle' && typeof v.root.isSameEntry === 'function') {
      try { if (await v.root.isSameEntry(h)) { v.ready = true; await go(activeTab(), { vol: v.id, path: '/' }); return; } } catch (e) { /* разные */ }
    }
  }
  const rec = { id: uid(), handle: h, added: Date.now() };
  try { await IDB.put('handles', [rec]); } catch (e) { /* без запоминания между запусками */ }
  const v = new HandleVolume(rec);
  v.ready = true;
  App.vols.set(v.id, v);
  await go(activeTab(), { vol: v.id, path: '/' });
}
async function forgetVol(volId) {
  const v = vol(volId);
  if (!v || v.kind !== 'handle') return;
  App.vols.delete(volId);
  try { await IDB.del('handles', [v.rec.id]); } catch (e) { /* нет базы */ }
  for (const p of App.panels) for (const tb of p.tabs) if (tb.loc.vol === volId) { tb.loc = { vol: 'demo', path: '/' }; tb.back = []; tb.fwd = []; load(tb); }

function pickFiles() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.addEventListener('change', () => { const files = [...inp.files]; if (files.length) importNodes(files.map((f) => ({ name: f.name, dir: false, file: f })), { ...activeTab().loc }); });
  inp.click();
}
async function importNodes(nodes, dest) {
  if (!nodes.length) return;
  const dv = new DropVolume(nodes);
  App.vols.set(dv.id, dv);
  try {
    const items = nodes.map((n) => ({ vol: dv.id, path: '/' + n.name, name: n.name, dir: n.dir }));
    const target = vol(dest.vol);
    await transfer(items, dest, 'copy', { title: t('d.importTitle'), askText: t('d.importMany', plural(items.length, 'items'), target ? target.base(dest.path) : '') });
  } finally { App.vols.delete(dv.id); }
}
// Брошенное с компьютера: в программе - пути настоящих файлов, в браузере - сами файлы
async function dropFromOutside(dt, dest) {
  if (NATIVE && dest.vol === 'native') {
    const paths = [...dt.files].map((f) => window.fmNative.pathForFile(f)).filter(Boolean);
    const items = [];
    for (const p of paths) { try { const st = await App.native.stat(p); items.push({ vol: 'native', path: p, name: App.native.base(p), dir: !!st.dir }); } catch (e) { /* исчез */ } }
    await transfer(items, dest, 'copy', { title: t('d.importTitle'), askText: t('d.importMany', plural(items.length, 'items'), App.native.base(dest.path)) });
    return;
  }
  const entries = dt.items ? [...dt.items].map((i) => (i.kind === 'file' && i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)) : [];
  const files = [...dt.files];
  let nodes;
  if (entries.some(Boolean)) nodes = await Promise.all(entries.filter(Boolean).map(readDropEntry));
  else nodes = files.map((f) => ({ name: f.name, dir: false, file: f }));
  await importNodes(nodes, dest);
}

// Команды: кнопки, меню и клавиши идут сюда
async function run(cmd, src) {
  const p = activePanel(), tab = activeTab();
  switch (cmd) {
    case 'back': return goBack(tab);
    case 'forward': return goForward(tab);
    case 'up': return goUp(tab);
    case 'refresh': return tab.search ? rerunSearch(tab) : (refreshVol(tab.loc.vol), load(tab));
    case 'newMenu': return menuAt(src, newItems());
    case 'newFolder': return createNew('dir');
    case 'newFile': return createNew('file');
    case 'cut': return setClip('cut');
    case 'copy': return setClip('copy');
    case 'paste': return paste();
    case 'rename': { const s = realSel(tab); if (s.length === 1) startRename(tab, s[0]); return; }

  if (ctrl && (ev.code === 'Backslash' || k === '\\')) { handled(); return run('dual'); }
  if (ctrl && shift && /^Digit[1-8]$/.test(ev.code)) { handled(); const d = +ev.code.slice(5); return setView(tab, d <= 3 || d >= 7 ? 'tiles' : d <= 5 ? 'list' : 'table'); }
  if (k === 'Tab' && !ctrl && !alt && settings.dual) { handled(); setActive(1 - App.active); focusView(); return; }
  if ((k === 'F10' && shift) || k === 'ContextMenu') {
    handled();
    const e = focusEntry(tab);
    let x = 120, y = 120;
    const el = e && p.items.querySelector(`.it[data-path="${CSS.escape(e.path)}"]`);
    if (el) { const r = el.getBoundingClientRect(); x = r.left + 24; y = r.top + r.height / 2; } else { const r = p.view.getBoundingClientRect(); x = r.left + 40; y = r.top + 40; }
    if (e && !tab.sel.has(e.path)) { tab.sel = new Set([e.path]); renderTab(tab); }
    return contextMenuFor(p, x, y, e && tab.sel.has(e.path) ? e : null);
  }
  if (!p.view.contains(document.activeElement) && document.activeElement !== document.body && document.activeElement !== p.view) {
    if (!ev.target.closest || !ev.target.closest('.panel, #sidebar')) return;
  }
  if (k === 'Enter') { handled(); const e = focusEntry(tab) || selectedEntries(tab)[0]; if (e) openEntry(tab, e, { newTab: ctrl && e.dir }); return; }
  if (k === 'Backspace') { handled(); return goBack(tab); }
  if (k === 'Escape') { handled(); if (App.clip && App.clip.mode === 'cut' && !tab.sel.size) { App.clip = null; renderItems(p); renderToolbar(); return; } tab.sel.clear(); renderTab(tab); renderPreview(); renderToolbar(); return; }
  if (k === ' ' && ctrl) { handled(); if (tab.focus) { if (tab.sel.has(tab.focus)) tab.sel.delete(tab.focus); else tab.sel.add(tab.focus); renderTab(tab); renderPreview(); renderToolbar(); } return; }
  if (k === ' ' && !shift) { handled(); return run('preview'); }
  const L = p.layout || { cols: 1 };
  const pageRows = Math.max(1, Math.floor(p.view.clientHeight / (L.ch || 28)) - 1);
  const nav = { ArrowDown: L.cols, ArrowUp: -L.cols, ArrowRight: L.mode === 'row' ? 0 : 1, ArrowLeft: L.mode === 'row' ? 0 : -1, PageDown: pageRows * L.cols, PageUp: -pageRows * L.cols };
  if (k in nav) { handled(); if (nav[k]) moveFocus(p, nav[k], ev); return; }
  if (k === 'Home') { handled(); return moveFocus(p, 0, ev, 0); }
  if (k === 'End') { handled(); return moveFocus(p, 0, ev, tab.shown.length - 1); }
  // буквы: переход к имени (как в Проводнике: набранное за секунду - начало имени)
  if (k.length === 1 && !ctrl && !alt && k !== ' ') {
    handled();
    const now = Date.now();
    typeAhead.text = now - typeAhead.at > 1000 ? k : typeAhead.text + k;
    typeAhead.at = now;
    const q = typeAhead.text.toLowerCase();
    const same = q.split('').every((c) => c === q[0]);
    const cur = tab.focus ? tab.shown.findIndex((e) => e.path === tab.focus) : -1;
    const n = tab.shown.length;
    for (let s = 0; s < n; s++) {
      const i = same && q.length >= 1 ? (cur + 1 + s) % n : (Math.max(cur, 0) + s) % n;
      const name = tab.shown[i].name.toLowerCase();
      if (same ? name.startsWith(q[0]) : name.startsWith(q)) { moveFocus(p, 0, null, i); break; }
    }
  }
}

// ---------------------------------------------------------------------------------------
// Запуск
async function init() {
  applyTheme(); applyTexts();
  IDB.db = await IDB.open();
  if (NATIVE) {
    App.info = await window.fmNative.info();
    App.native = new NativeVolume(window.fmNative, App.info);
    App.vols.set('native', App.native);
    window.fmNative.on('changed', (d) => { const tab = Watchers.get(d.id); if (tab && !tab.loading) { if (tab.search) rerunSearch(tab); else load(tab); } for (const k of [...App.tree.cache.keys()]) if (k.startsWith('native\n')) App.tree.cache.delete(k); renderSidebar(); });
    window.fmNative.on('open', (d) => { if (d && d.path) addTab(activePanel(), { vol: 'native', path: d.path }); });
  } else {
    App.demo = new DemoVolume();
    await App.demo.init();
    App.vols.set('demo', App.demo);
    if (IDB.db) {
      for (const rec of await IDB.all('handles').catch(() => [])) {
        if (!rec || !rec.handle || typeof rec.handle.getDirectoryHandle !== 'function') continue;
        const v = new HandleVolume(rec);
        await v.ensure(false);
        App.vols.set(v.id, v);
      }
    }
  }
  const home = NATIVE ? { vol: 'native', path: App.info.start || '' } : { vol: 'demo', path: '/' };
  const session = NATIVE && App.info.test ? null : Store.get('session', null);
  $('#panels').replaceChildren();
  for (let i = 0; i < 2; i++) {
    const p = new Panel(i);
    App.panels.push(p);
    $('#panels').appendChild(p.el);
    const saved = session && Array.isArray(session.panels) && session.panels[i];
    const tabs = saved && Array.isArray(saved.tabs) ? saved.tabs.filter((x) => x && typeof x.path === 'string' && vol(x.vol) && (vol(x.vol).kind !== 'handle' || vol(x.vol).ready)) : [];
    p.tabs = (tabs.length ? tabs : [home]).slice(0, 30).map((x) => { const tb = newTab(x); if (VIEWS.includes(x.view)) tb.view = x.view; return tb; });
    p.cur = saved && saved.cur < p.tabs.length && saved.cur >= 0 ? saved.cur : 0;
    if (!tabs.length || saved.tabs.length !== tabs.length) p.cur = 0;
    bindPanel(p);
  }
  App.active = session && session.active === 1 && settings.dual ? 1 : 0;
  $('#panels').classList.toggle('dual', settings.dual);
  App.panels[1].el.hidden = !settings.dual;
  bindSidebar();
  // кнопки панели команд и навигации
  document.addEventListener('click', (ev) => {
    const mi = ev.target.closest('#menu .mi');
    if (mi) { const it = Menu.items[+mi.dataset.i]; hideMenu(); if (it && it.run) it.run(); return; }
    if (Menu.el && !ev.target.closest('#menu')) hideMenu();
    const b = ev.target.closest('#toolbar [data-cmd], .nav [data-cmd], .status [data-cmd], .tab-add[data-cmd]');
    if (b && !b.disabled) { const pn = ev.target.closest('.panel'); if (pn) setActive(+pn.dataset.panel); run(b.dataset.cmd, b); }
  });
  document.addEventListener('contextmenu', (ev) => { if (!ev.target.closest('.view, #sidebar, .tabs, input')) ev.preventDefault(); });
  document.addEventListener('mousedown', (ev) => { if (Menu.el && !ev.target.closest('#menu')) hideMenu(); });
  document.addEventListener('keydown', onKey);
  document.addEventListener('mouseup', (ev) => { if (ev.button === 3 || ev.button === 4) { ev.preventDefault(); if ($('#viewer').hidden && !Modal.stack.length) (ev.button === 3 ? goBack : goForward)(activeTab()); } });
  window.addEventListener('blur', hideMenu);
  window.addEventListener('resize', hideMenu);
  $('#viewer').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-vw]');
    if (!b) { if (ev.target.classList.contains('vw-body')) closeViewer(); return; }
    const a = b.dataset.vw;
    if (a === 'close') closeViewer();
    else if (a === 'prev') viewerStep(-1);
    else if (a === 'next') viewerStep(1);
    else if (a === 'wrap') { settings.wrap = !settings.wrap; saveSettings(); openViewer(Viewer.tab, Viewer.entry); }
    else if (a === 'system') openSystem(Viewer.entry);
  });
  $('#modal').addEventListener('mousedown', (ev) => { if (ev.target.id === 'modal') { const m = Modal.stack[Modal.stack.length - 1]; if (m && m.onKey) m.onKey(new KeyboardEvent('keydown', { key: 'Escape' })); } });
  // файлы с компьютера, брошенные мимо панелей: в активную папку
  document.addEventListener('dragover', (ev) => {
    if (Drag.items || !ev.dataTransfer || ![...ev.dataTransfer.types].includes('Files')) return;
    if (!inFolder(activeTab())) return;
    ev.preventDefault();
    const hint = $('#drop-hint');
    hint.textContent = t('drop.hint', vol(activeTab().loc.vol).base(activeTab().loc.path));
    hint.hidden = false;
  });
  document.addEventListener('dragleave', (ev) => { if (!ev.relatedTarget) $('#drop-hint').hidden = true; });
  document.addEventListener('drop', (ev) => {
    $('#drop-hint').hidden = true;
    if (Drag.items || !ev.dataTransfer || !ev.dataTransfer.files.length) return;
    ev.preventDefault();
    if (inFolder(activeTab())) dropFromOutside(ev.dataTransfer, { ...activeTab().loc });
  });
  window.addEventListener('focus', () => { const tab = activeTab(); if (tab && !NATIVE && tab.loc.vol !== 'demo' && !tab.search && !tab.loading) load(tab); });
  for (const p of App.panels) if (!p.el.hidden) { renderPanel(p); load(p.tab); }
  for (const p of App.panels) for (const tb of p.tabs) if (tb !== p.tab || p.el.hidden) tb.stale = true;
  expandTo(activeTab().loc);
  renderAll();
  focusView();
  await new Promise((r) => { const w = () => (App.pending ? setTimeout(w, 20) : r()); w(); });
  App.ready = true;
}

// Для проверок (tests/web/files-manager.spec.js и программа Electron)
window.__fm = {
  version: VERSION, Core, App, I18N, TRASH, TRASH_DIR,
  get ready() { return App.ready; },
  get settings() { return settings; },
  vol, activeTab, run,
  tab: (i) => { const tb = i === undefined ? activeTab() : App.panels[i].tab; return { vol: tb.loc.vol, path: tb.loc.path, names: tb.shown.map((e) => e.name), sel: selectedEntries(tb).map((e) => e.name), focus: tb.focus, view: tb.view, sort: tb.sort, desc: tb.desc, query: tb.query, error: tb.error, back: tb.back.length, fwd: tb.fwd.length, searching: !!(tb.search && tb.search.running) }; },
  go: (path, volId) => go(activeTab(), { vol: volId || activeTab().loc.vol, path }),
  select: (names) => { const tb = activeTab(); selectPaths(tb, tb.shown.filter((e) => names.includes(e.name)).map((e) => e.path), true); },
  idle: () => new Promise((res, rej) => {
    const t0 = Date.now();
    let calm = 0;
    const w = () => {
      if (App.pending === 0 && !App.panels.some((p) => p.tab && p.tab.loading)) { if (++calm >= 3) return res(true); } else calm = 0;
      if (Date.now() - t0 > 20000) return rej(new Error('__fm.idle: занято дольше 20 с (pending ' + App.pending + ')'));
      setTimeout(w, 15);
    };
    w();
  }),
};
init().catch((e) => { console.error(e); document.body.insertAdjacentHTML('beforeend', `<pre style="position:fixed;inset:auto 10px 10px;color:#f66">${esc(String(e && e.stack || e))}</pre>`); });
</script>
