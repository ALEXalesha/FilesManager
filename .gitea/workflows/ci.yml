# Проверки на домашнем Gitea, на раннере ПК (метка windows).
# Здесь только законы страницы (демо-диск в IndexedDB безголового Chromium).
# Закон настоящей программы Electron (tests/files-manager-app.spec.js) гоняют перед выпуском:
# он кладёт временный файл в Корзину Windows того, кто его запускает.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Проверки
    runs-on: windows
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Chromium для Playwright
        run: npx playwright install chromium

      - name: Законы страницы
        run: npx playwright test tests/files-manager.spec.js --workers=1
